<!DOCTYPE html> 
<meta charset="UTF-8">
<html>
<head>
    <title>ASX Scraper</title>
    <script src="date-fns.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 600px;
            padding: 10px;
        }
        label {
            display: block;
            margin: 5px 0;
        }
        input[type="number"] {
            width: 50px;
        }
        button {
            margin: 5px 0;
            padding: 5px 10px;
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
        }
        #tabTracking {
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .tab-entry {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 5px;
            border-bottom: 1px solid #eee;
            position: relative;
        }
        .tab-entry span {
            flex: 1;
            margin-right: 10px;
        }
        .tab-entry .timer {
            position: absolute;
            top: 0;
            left: 0;
            font-size: 10px;
            color: #666;
            flex: none;
            margin: 0;
        }
        .tab-entry .restart-tab {
            font-weight: bold;
            line-height: 23px;
            font-size: 14px !important;
        }
        .tab-entry button:not(:disabled) {
            color: #000000;
        }
        .tab-entry button:disabled {
            color: #d0d0d0;
        }
        .tab-entry button {
            margin-left: 5px;
            padding: 3px 8px;
            font-size: 12px;
            height: 30px;
        }
        .columns {
            display: flex;
            gap: 20px;
        }
        .column {
            flex: 1;
        }
        .single-ticker-container {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        .single-ticker-container label {
            margin-right: 10px;
        }
        .single-ticker-container input {
            margin-right: 10px;
        }
        #transferStats {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
        #transferStats h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .stats-grid .stat-item:first-child {
            grid-column: 1 / -1;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .stat-label {
            font-weight: bold;
            font-size: 12px;
        }
        .stat-value {
            color: #0066cc;
            font-weight: bold;
            font-size: 14px;
        }
        #resetStatsButton {
            width: 100%;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h2>ASX Scraper</h2>
    <label>
        Max Tabs:
        <input type="number" id="maxTabs" value="1" min="1" max="10">
    </label>
    <label>
        <input type="checkbox" id="apiFetchAnnouncements" checked>
        Fetch Announcements via API
    </label>
    <label>
        <input type="checkbox" id="webScrapeAnnouncements" checked>
        Scrape Announcements from Web
    </label>
    <label>
        <input type="checkbox" id="downloadPdfs" checked>
        Download Announcement PDFs
    </label>
    <label>
        <input type="checkbox" id="closeTabs" checked>
        Close Tabs After Scraping
    </label>
    <button id="startButton">Start Scraping</button>
    <button id="pauseButton" disabled>Pause Scraping</button>
    <button id="resumeButton" disabled>Resume Scraping</button>
    <button id="updateConfigButton">Update Config</button>
    <div class="single-ticker-container">
        <label>
            Ticker Symbol:
            <input type="text" id="singleTicker" placeholder="e.g., ABC">
        </label>
        <button id="scrapeSingleButton">Scrape Single Ticker</button>
    </div>
    <div id="status">Idle</div>
    <div id="transferStats">
        <h3>Transfer Statistics</h3>
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label">Total Transfers:</span>
                <span class="stat-value" id="totalTransfers">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">PDF Files:</span>
                <span class="stat-value" id="pdfTransfers">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">CSV Files:</span>
                <span class="stat-value" id="csvTransfers">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">JSON Files:</span>
                <span class="stat-value" id="jsonTransfers">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Other Files:</span>
                <span class="stat-value" id="otherTransfers">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total Data:</span>
                <span class="stat-value" id="totalData">0 B</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Avg Speed:</span>
                <span class="stat-value" id="avgSpeed">0 B/s</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Last Speed:</span>
                <span class="stat-value" id="lastSpeed">0 B/s</span>
            </div>
        </div>
        <button id="resetStatsButton">Reset Statistics</button>
    </div>
    <div id="tabTracking">
        <!-- Tab entries will be dynamically added here -->
    </div>
    <div id="loggingPreferences">
        <h3>Logging Preferences</h3>
        <div class="columns">
            <div class="column">
                <label><input type="checkbox" class="category-checkbox" data-category="Diagnostic"> All Diagnostic Logs</label>
                <h4>Diagnostic Logs</h4>
                <label><input type="checkbox" id="ErrorHandlingLogs"> Error Handling Logs</label>
                <label><input type="checkbox" id="ErrorLogs"> Error Logs</label>
                <label><input type="checkbox" id="WarningLogs"> Warning Logs</label>
                <label><input type="checkbox" id="GeneralLogs"> General Logs</label>
                <label><input type="checkbox" id="DebugLogs"> Debug Logs</label>
                <label><input type="checkbox" id="NotificationLogs"> Notification Logs</label>
            </div>
            <div class="column">
                <label><input type="checkbox" class="category-checkbox" data-category="Operation"> All Operation Logs</label>
                <h4>Operation Logs</h4>
                <label><input type="checkbox" id="ScrapeLogs"> Scrape Logs</label>
                <label><input type="checkbox" id="ServerLogs"> Server Logs</label>
                <label><input type="checkbox" id="TickerCompletionLogs"> Completion Logs</label>
                <label><input type="checkbox" id="DataLogs"> Data Logs</label>
                <label><input type="checkbox" id="AnnouncementLogs"> Announcement Logs</label>
            </div>
            <div class="column">
                <label><input type="checkbox" class="category-checkbox" data-category="System"> All System Logs</label>
                <h4>System Logs</h4>
                <label><input type="checkbox" id="TabLogs"> Tab Logs</label>
                <label><input type="checkbox" id="PortLogs"> Port Logs</label>
                <label><input type="checkbox" id="ConfigLogs"> Config Logs</label>
                <label><input type="checkbox" id="RetryLogs"> Retry Logs</label>
                <label><input type="checkbox" id="ActionLogs"> Action Logs</label>
                <label><input type="checkbox" id="PerfLogs"> Performance Logs</label>
                <label><input type="checkbox" id="DownloadLogs"> Download Logs</label>
            </div>
            <div class="column">
                <label><input type="checkbox" class="category-checkbox" data-category="Prefix"> All Prefix Logs</label>
                <h4>Prefix Logs</h4>
                <label><input type="checkbox" id="prefixDateTime"> Prefix DateTime</label>
                <label><input type="checkbox" id="prefixTickerSymbol"> Prefix TickerSymbol</label>
                <label><input type="checkbox" id="prefixTabId"> Prefix TabId</label>
                <label><input type="checkbox" id="prefixPortId"> Prefix PortId</label>
                <label><input type="checkbox" id="prefixPortName"> Prefix PortName</label>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</html>
